<script>
const root = document.getElementById("songList");
const player = document.getElementById("player");
const playAll = document.getElementById("playAll");
const playAllLabel = document.getElementById("playAllLabel");
const playAllStatus = document.getElementById("playAllStatus");
const playPrev = document.getElementById("playPrev");
const playNext = document.getElementById("playNext");
const playShuffle = document.getElementById("playShuffle");
const songs = (typeof SONGS !== "undefined" && Array.isArray(SONGS)) ? SONGS : [];
const FADE_MS = 900;
const GAP_MS = 3000;
const cards = [];
let playlist = false;
let cursor = -1;
let phase = "idle";
let fadeFrame = 0;
let gapTimer = 0;
let userPaused = false;
// 재생 순서: order 는 곡 번호(cards 의 순서) 목록, pos 는 그중 지금 위치입니다. 랜덤 듣기면 섞인 순서입니다.
let order = [];
let pos = -1;
let shuffle = false;
// 곡이 실패했을 때 다시 시도한 횟수와 마지막으로 들은 위치
let errorTries = 0;
let lastGoodTime = 0;
// 전화 등으로 시스템이 멈췄는지(사용자가 누른 일시정지가 아님)
let interrupted = false;
let srcChangedAt = 0;

function seqOrder() {
  return cards.map((_, i) => i);
}
function shuffledOrder() {
  const a = seqOrder();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function nextIdx() {
  return (pos >= 0 && pos + 1 < order.length) ? order[pos + 1] : -1;
}
function prevIdx() {
  return pos > 0 ? order[pos - 1] : -1;
}
// 곡 사이 3초 쉼: 3초짜리 무음을 같은 <audio> 로 재생합니다.
// 타이머를 쓰지 않아서 화면이 꺼져 있어도 쉼 뒤 다음 곡으로 넘어갑니다.
const GAP_URL = (function () {
  try {
    const rate = 8000;
    const n = Math.round(rate * GAP_MS / 1000);
    const buf = new ArrayBuffer(44 + n);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
    str(36, "data"); v.setUint32(40, n, true);
    for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  } catch (e) {
    return "";
  }
})();

// 안드로이드 앱 안에서는 재생 목록 전체를 앱의 네이티브 플레이어가 재생합니다(화면이 꺼져도 다음 곡으로 넘어감).
// 이 페이지는 화면 표시와 조작만 맡습니다. 앱이 없으면(일반 브라우저) 아래 <audio> 로 재생합니다.
const NATIVE = (function () {
  try {
    if (window.jw3Player && typeof window.jw3Player.postMessage === "function") {
      return (msg) => window.jw3Player.postMessage(JSON.stringify(msg));
    }
    if (window.jw3PlayerRaw && typeof window.jw3PlayerRaw.post === "function") {
      return (msg) => window.jw3PlayerRaw.post(JSON.stringify(msg));
    }
  } catch (e) {}
  return null;
})();
const nat = { paused: true, time: 0, duration: NaN, holdUrl: "", holdUntil: 0, gap: false, count: 0 };
const media = {
  get paused() { return NATIVE ? nat.paused : player.paused; },
  get currentTime() { return NATIVE ? nat.time : player.currentTime; },
  get duration() { return NATIVE ? nat.duration : player.duration; },
  get playbackRate() { return NATIVE ? 1 : player.playbackRate; },
};
function absUrl(path) {
  return new URL(path, location.href).href;
}
window.JW3Native = NATIVE ? {
  play(index, list) { NATIVE({ cmd: "play", index: index, list: list }); },
  pause() { NATIVE({ cmd: "pause" }); },
  resume() { NATIVE({ cmd: "resume", index: Math.max(0, pos), list: nativeList(), position: nat.time || 0 }); },
  next() { NATIVE({ cmd: "next" }); },
  prev() { NATIVE({ cmd: "prev" }); },
  seek(sec) { NATIVE({ cmd: "seek", position: sec }); },
  stop() { NATIVE({ cmd: "stop" }); },
  state() { NATIVE({ cmd: "state" }); },
} : null;
function nativeList() {
  const list = (order.length === cards.length) ? order : seqOrder();
  return list.map((i) => cards[i]).map((card) => ({
    url: absUrl(card.dataset.audio),
    title: card.dataset.title,
    artist: "정완(글렙)",
    album: "글렙의 노래",
    art: card.dataset.cover ? absUrl(card.dataset.cover) : "",
  }));
}

function pageHidden() {
  return document.hidden || document.visibilityState === "hidden";
}

function clearGapTimer() {
  if (gapTimer) {
    clearTimeout(gapTimer);
    gapTimer = 0;
  }
}

const listScroll = document.getElementById("listScroll");
const listTrack = document.getElementById("listTrack");
const listThumb = document.getElementById("listThumb");
let thumbDrag = null;

function revealRow(card) {
  const pane = listScroll.getBoundingClientRect();
  const row = card.getBoundingClientRect();
  if (row.top < pane.top) listScroll.scrollTop -= pane.top - row.top;
  else if (row.bottom > pane.bottom) listScroll.scrollTop += row.bottom - pane.bottom;
  updateListThumb();
}

function updateListThumb() {
  const trackH = listTrack.clientHeight;
  const scrollH = listScroll.scrollHeight;
  const viewH = listScroll.clientHeight;
  if (trackH <= 0) return;
  if (scrollH <= viewH + 1) {
    listThumb.style.height = trackH + "px";
    listThumb.style.transform = "translateY(0)";
    return;
  }
  const thumbH = Math.max(22, Math.round(trackH * viewH / scrollH));
  const maxTop = Math.max(0, trackH - thumbH);
  const top = maxTop * (listScroll.scrollTop / (scrollH - viewH));
  listThumb.style.height = thumbH + "px";
  listThumb.style.transform = "translateY(" + top + "px)";
}

function queueThumb() {
  requestAnimationFrame(updateListThumb);
}

function scrollFromPointer(e) {
  const track = listTrack.getBoundingClientRect();
  const thumbH = listThumb.getBoundingClientRect().height;
  const maxTop = Math.max(1, track.height - thumbH);
  const y = e.clientY - track.top - thumbDrag.offset;
  const ratio = Math.min(1, Math.max(0, y / maxTop));
  listScroll.scrollTop = ratio * (listScroll.scrollHeight - listScroll.clientHeight);
}

listScroll.addEventListener("scroll", updateListThumb, { passive: true });
window.addEventListener("resize", updateListThumb);
if (window.ResizeObserver) new ResizeObserver(updateListThumb).observe(listScroll);
document.querySelector(".stage-art").addEventListener("transitionend", (e) => {
  if (e.propertyName !== "width") return;
  if (cursor >= 0 && cards[cursor] && !pageHidden()) revealRow(cards[cursor]);
});
listTrack.addEventListener("pointerdown", (e) => {
  const thumb = listThumb.getBoundingClientRect();
  const onThumb = e.clientY >= thumb.top && e.clientY <= thumb.bottom;
  thumbDrag = { offset: onThumb ? e.clientY - thumb.top : thumb.height / 2 };
  listTrack.setPointerCapture(e.pointerId);
  scrollFromPointer(e);
});
listTrack.addEventListener("pointermove", (e) => {
  if (thumbDrag) scrollFromPointer(e);
});
listTrack.addEventListener("pointerup", () => { thumbDrag = null; });
listTrack.addEventListener("pointercancel", () => { thumbDrag = null; });

let wantVideo = false;
let videoSongKey = "";

function rememberSong(card) {
  const key = card ? String(card.dataset.audio || "") : "";
  if (key !== videoSongKey) {
    wantVideo = false;
    videoSongKey = key;
  }
}

function showCover(card) {
  const art = document.getElementById("stageArt");
  const dockArt = document.getElementById("dockArt");
  rememberSong(card);
  if (!card) {
    document.body.classList.remove("playing");
    if (art.getAttribute("src") !== "covers/album.jpg") art.src = "covers/album.jpg";
    art.alt = "글렙의 노래 표지";
    dockArt.removeAttribute("src");
    document.getElementById("dockTitle").textContent = "";
    document.getElementById("slideTitle").textContent = "";
    document.getElementById("stageCredit").textContent = (typeof DEFAULT_CREDIT === "string" && DEFAULT_CREDIT) ? DEFAULT_CREDIT : "작사·작곡 정완(글렙)";
    document.querySelector(".stage-art").classList.remove("is-plain");
    hideSlides();
    updateMediaButton();
    queueThumb();
    return;
  }
  document.body.classList.add("playing");
  if (art.getAttribute("src") !== card.dataset.cover) {
    art.src = card.dataset.cover;
    dockArt.src = card.dataset.cover;
  }
  art.alt = card.dataset.title + " 표지";
  dockArt.alt = "";
  document.getElementById("dockTitle").textContent = card.dataset.title;
  document.getElementById("slideTitle").textContent = card.dataset.title;
  document.getElementById("stageCredit").textContent = card.dataset.credit || "";
  document.querySelector(".stage-art").classList.toggle("is-plain", card.dataset.plain === "1");
  hideSlides();
  syncSlides();
  updateMediaButton();
  queueThumb();
}

let slideBook = {};
let shownSlide = "";
let shownVideo = "";
let snapFullVideo = false;
const slideA = document.getElementById("slideA");
const slideB = document.getElementById("slideB");
const clipA = document.getElementById("clipA");
const clipB = document.getElementById("clipB");
const clips = [clipA, clipB];
let slideOnA = false;
let clipOnA = false;
clips.forEach((el) => {
  el.addEventListener("play", () => {
    if (!el.classList.contains("on")) el.pause();
  });
});

function songSlideKey() {
  if (cursor < 0 || !cards[cursor]) return "";
  const file = String(cards[cursor].dataset.audio || "").split("/").pop() || "";
  return file.replace(/\.mp3$/i, "");
}

function cuesForSong() {
  const list = slideBook[songSlideKey()];
  return Array.isArray(list) ? list : null;
}

function cueAt(time, cues) {
  let pick = cues[0];
  for (let i = 0; i < cues.length; i++) {
    const t = Number(cues[i] && cues[i].t);
    if (t <= time + 0.02) pick = cues[i];
    else break;
  }
  return pick;
}

function videoIdOf(cue) {
  const id = cue && typeof cue.video === "string" ? cue.video.trim() : "";
  return id;
}

// 한 곡이 처음부터 끝까지 같은 영상 하나면, 그 영상은 소리의 현재 위치에 맞춘다.
// 1·2번처럼 구간마다 다른 클립은 여기서 걸리지 않고, 클립 처음(0초)부터 재생한다.
function fullSongVideoId(cues) {
  if (!cues || !cues.length) return "";
  const id = videoIdOf(cues[0]);
  if (!id) return "";
  for (let i = 1; i < cues.length; i++) {
    if (videoIdOf(cues[i]) !== id) return "";
  }
  return id;
}

function alignFullClip(el, force) {
  if (!el || el.readyState < 1) return;
  let target = Number(media.currentTime) || 0;
  if (!Number.isFinite(target) || target < 0) target = 0;
  const dur = el.duration;
  if (Number.isFinite(dur) && dur > 0 && target > dur) target = dur;
  if (el.seeking) {
    const pending = Number(el.dataset.alignTarget);
    if (Number.isFinite(pending) && Math.abs(pending - target) < 0.05) return;
  }
  const drift = Math.abs((el.currentTime || 0) - target);
  if (!force && drift <= 0.5) return;
  if (drift < 0.05) return;
  el.dataset.alignTarget = String(target);
  if (el._alignKick) el.removeEventListener("seeked", el._alignKick);
  const kick = () => {
    el.removeEventListener("seeked", kick);
    if (el._alignKick === kick) el._alignKick = null;
    if (media.paused || pageHidden()) return;
    if (!el.classList.contains("on") || el.dataset.videoId !== shownVideo) return;
    if (fullSongVideoId(cuesForSong()) !== el.dataset.videoId) return;
    playClip(el);
  };
  el._alignKick = kick;
  el.addEventListener("seeked", kick);
  try { el.currentTime = target; } catch (e) {
    el.removeEventListener("seeked", kick);
    if (el._alignKick === kick) el._alignKick = null;
  }
}

function fillClip(el, id) {
  if (el.dataset.videoId === id) return;
  el.dataset.videoId = id;
  el.classList.remove("on");
  el.pause();
  while (el.firstChild) el.removeChild(el.firstChild);
  const webm = document.createElement("source");
  webm.src = "videos/" + id + ".webm?v=4";
  webm.type = "video/webm";
  const mp4 = document.createElement("source");
  mp4.src = "videos/" + id + ".mp4?v=4";
  mp4.type = "video/mp4";
  el.append(webm, mp4);
  el.muted = true;
  el.load();
}

function hideClips() {
  clips.forEach((el) => {
    el.classList.remove("on");
    el.pause();
  });
  shownVideo = "";
}

function playClip(el) {
  el.muted = true;
  if (media.paused || (el.ended && !el.loop)) {
    if (!media.paused && el.ended && !el.loop) return;
    el.pause();
    return;
  }
  const pending = el.play();
  if (pending && typeof pending.catch === "function") {
    pending.catch(() => { el.classList.remove("on"); });
  }
}

function showClip(cue) {
  const id = videoIdOf(cue);
  const loop = !cue || cue.loop !== false;
  const full = !!id && fullSongVideoId(cuesForSong()) === id;
  if (!wantVideo || !id) {
    snapFullVideo = false;
    hideClips();
    return;
  }
  if (!full) snapFullVideo = false;
  if (shownVideo === id) {
    const current = clipOnA ? clipA : clipB;
    current.loop = loop;
    if (current.dataset.videoId === id && current.readyState >= 2 && !current.error) {
      if (full) {
        alignFullClip(current, snapFullVideo);
        snapFullVideo = false;
        if (current.seeking) {
          current.classList.add("on");
          return;
        }
      }
      if (current.ended && !current.loop) {
        current.classList.add("on");
        return;
      }
      current.classList.add("on");
      if (current.paused) playClip(current);
    }
    return;
  }
  shownVideo = id;
  let incoming = clips.find((el) => el.dataset.videoId === id);
  if (!incoming) incoming = clipOnA ? clipB : clipA;
  const outgoing = incoming === clipA ? clipB : clipA;
  const reveal = () => {
    if (shownVideo !== id || incoming.dataset.videoId !== id) return;
    if (incoming.error) {
      incoming.classList.remove("on");
      return;
    }
    incoming.loop = loop;
    incoming.classList.add("on");
    outgoing.classList.remove("on");
    outgoing.pause();
    clipOnA = incoming === clipA;
    if (full) alignFullClip(incoming, true);
    else if (incoming.currentTime > 0.05) incoming.currentTime = 0;
    snapFullVideo = false;
    if (!full || !incoming.seeking) playClip(incoming);
  };
  incoming.oncanplay = () => { incoming.oncanplay = null; reveal(); };
  incoming.onerror = () => { incoming.onerror = null; if (shownVideo === id) incoming.classList.remove("on"); };
  if (incoming.dataset.videoId !== id) fillClip(incoming, id);
  else if (incoming.readyState >= 2 && !incoming.error) reveal();
}

function preloadUpcoming(cue, cues) {
  const start = cues.indexOf(cue);
  let nextImg = "";
  let nextVideo = "";
  const currentVideo = videoIdOf(cue);
  for (let i = start + 1; i < cues.length; i++) {
    if (!nextImg && cues[i] && cues[i].img && cues[i].img !== cue.img) nextImg = cues[i].img;
    const vid = videoIdOf(cues[i]);
    if (!nextVideo && vid && vid !== currentVideo) nextVideo = vid;
    if (nextImg && nextVideo) break;
  }
  if (nextImg) {
    const img = new Image();
    img.src = "slides/" + nextImg;
  }
  if (!wantVideo || !nextVideo) return;
  const spare = clips.find((el) => el.dataset.videoId !== shownVideo);
  if (spare && spare.dataset.videoId !== nextVideo) fillClip(spare, nextVideo);
}

function hideSlides() {
  slideA.classList.remove("on");
  slideB.classList.remove("on");
  shownSlide = "";
  hideClips();
  document.getElementById("stageArt").style.visibility = "";
}

function revealSlide(incoming, outgoing, src) {
  if (shownSlide !== src) return;
  incoming.classList.add("on");
  outgoing.classList.remove("on");
  slideOnA = incoming === slideA;
  document.getElementById("stageArt").style.visibility = "hidden";
}

function showSlide(cue, cues) {
  if (!cue || !cue.img) return;
  const src = "slides/" + String(cue.img);
  showClip(cue);
  preloadUpcoming(cue, cues);
  if (src === shownSlide) return;
  shownSlide = src;
  const incoming = slideOnA ? slideB : slideA;
  const outgoing = slideOnA ? slideA : slideB;
  if (incoming.getAttribute("src") === src && incoming.complete && incoming.naturalWidth) {
    revealSlide(incoming, outgoing, src);
    return;
  }
  incoming.onload = () => {
    incoming.onload = null;
    revealSlide(incoming, outgoing, src);
  };
  incoming.src = src;
  if (incoming.complete && incoming.naturalWidth) revealSlide(incoming, outgoing, src);
}

function syncSlides() {
  if (!document.body.classList.contains("playing") || cursor < 0 || phase === "idle") {
    hideSlides();
    return;
  }
  if (pageHidden()) {
    clips.forEach((el) => el.pause());
    return;
  }
  if (phase === "gap") return;
  const cues = cuesForSong();
  if (!cues || !cues.length) return;
  showSlide(cueAt(media.currentTime || 0, cues), cues);
  updateMediaButton();
}

function updateMediaButton() {
  const btn = document.getElementById("mediaMode");
  const cues = cuesForSong();
  const enabled = document.body.classList.contains("playing") && !!(cues && cues.some((cue) => videoIdOf(cue)));
  btn.hidden = !enabled;
  btn.textContent = wantVideo ? "사진 보기" : "영상 보기";
  btn.setAttribute("aria-pressed", wantVideo ? "true" : "false");
}

document.getElementById("mediaMode").addEventListener("click", () => {
  if (document.getElementById("mediaMode").hidden) return;
  wantVideo = !wantVideo;
  if (!wantVideo) hideClips();
  else snapFullVideo = true;
  syncSlides();
  updateMediaButton();
});

fetch("slides/timings.json").then((res) => res.json()).then((data) => {
  slideBook = data || {};
  syncSlides();
}).catch(() => {});

function setCurrent(card) {
  cards.forEach((item) => {
    const on = item === card;
    item.classList.toggle("current", on);
    const cue = item.querySelector(".song-cue");
    cue.textContent = on ? "❚❚" : "▶";
    if (on) item.setAttribute("aria-current", "true");
    else item.removeAttribute("aria-current");
  });
  showCover(card);
}

function updateTransport() {
  const pauseBtn = document.getElementById("playPause");
  if (pauseBtn) pauseBtn.textContent = media.paused ? "재생" : "일시정지";
  if (!playlist || cursor < 0) {
    playAllLabel.textContent = "연속 듣기";
    playAll.setAttribute("aria-pressed", "false");
    playShuffle.setAttribute("aria-pressed", "false");
    if (cursor < 0 && playAllStatus.textContent !== "끝까지 들었습니다") playAllStatus.textContent = "";
    playPrev.disabled = true;
    playNext.disabled = true;
    return;
  }
  playAllLabel.textContent = "정지";
  playAll.setAttribute("aria-pressed", "true");
  playShuffle.setAttribute("aria-pressed", shuffle ? "true" : "false");
  const resting = phase === "gap" || (NATIVE && nat.gap && !nat.paused);
  if (resting) playAllStatus.textContent = "쉬는 중";
  else if (interrupted && media.paused) playAllStatus.textContent = "멈췄어요 · 재생을 누르면 이어서 들어요";
  else playAllStatus.textContent = shuffle ? "랜덤 듣기" : "";
  playPrev.disabled = prevIdx() < 0;
  playNext.disabled = nextIdx() < 0;
}

function artworkUrl(path) {
  return new URL(path, location.href).href;
}

let sessionKey = "";
let positionAt = 0;

function updatePosition(force) {
  if (NATIVE || !("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
  if (phase !== "song" || !Number.isFinite(player.duration) || player.duration <= 0) return;
  const now = Date.now();
  if (!force && now - positionAt < 1000) return;
  positionAt = now;
  try {
    navigator.mediaSession.setPositionState({
      duration: player.duration,
      playbackRate: player.playbackRate || 1,
      position: Math.min(Math.max(0, player.currentTime || 0), player.duration),
    });
  } catch (e) {}
}

function updateSession() {
  // 앱에서는 네이티브 플레이어가 알림·잠금 화면 조작을 맡습니다.
  if (NATIVE) return;
  if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  const card = cursor >= 0 ? cards[cursor] : null;
  if (!card) {
    sessionKey = "";
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = "none";
    return;
  }
  const key = card.dataset.audio;
  if (key !== sessionKey || !navigator.mediaSession.metadata) {
    sessionKey = key;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: card.dataset.title,
      artist: "정완(글렙)",
      album: "글렙의 노래",
      artwork: [
        { src: artworkUrl(card.dataset.cover), sizes: "1024x1024", type: "image/jpeg" },
      ],
    });
  }
  navigator.mediaSession.playbackState = (userPaused || (player.paused && phase !== "gap")) ? "paused" : "playing";
  updatePosition(true);
}

function fadeIn() {
  cancelAnimationFrame(fadeFrame);
  player.volume = 1;
  if (pageHidden()) return;
  const start = performance.now();
  const step = (now) => {
    if (pageHidden()) {
      player.volume = 1;
      return;
    }
    const t = (now - start) / FADE_MS;
    if (!(t >= 0) || t >= 1) {
      player.volume = 1;
      return;
    }
    player.volume = t;
    fadeFrame = requestAnimationFrame(step);
  };
  fadeFrame = requestAnimationFrame(step);
}

function stopPlayback() {
  clearGapTimer();
  cancelAnimationFrame(fadeFrame);
  phase = "idle";
  playlist = false;
  cursor = -1;
  order = [];
  pos = -1;
  shuffle = false;
  interrupted = false;
  if (NATIVE) {
    window.JW3Native.stop();
    nat.paused = true;
    nat.holdUntil = 0;
  }
  player.pause();
  player.removeAttribute("src");
  setCurrent(null);
  updateTransport();
  updateSession();
}

function finishPlaylist() {
  clearGapTimer();
  cancelAnimationFrame(fadeFrame);
  phase = "idle";
  playlist = false;
  if (NATIVE) {
    window.JW3Native.stop();
    nat.paused = true;
    nat.holdUntil = 0;
  }
  player.pause();
  player.removeAttribute("src");
  setCurrent(null);
  playAllLabel.textContent = "연속 듣기";
  playAll.setAttribute("aria-pressed", "false");
  playShuffle.setAttribute("aria-pressed", "false");
  playAllStatus.textContent = "끝까지 들었습니다";
  playPrev.disabled = true;
  playNext.disabled = true;
  cursor = -1;
  order = [];
  pos = -1;
  shuffle = false;
  interrupted = false;
  updateSession();
}

function pauseAudio() {
  if (NATIVE) {
    window.JW3Native.pause();
    if (!nat.paused) {
      nat.paused = true;
      player.dispatchEvent(new Event("pause"));
    }
    return;
  }
  player.pause();
}

function playAudio() {
  if (NATIVE) {
    window.JW3Native.resume();
    if (nat.paused) {
      nat.paused = false;
      player.dispatchEvent(new Event("play"));
    }
    updateTransport();
    return;
  }
  const pending = player.play();
  const after = (failed) => {
    updateTransport();
    updateSession();
    if (failed && playlist && cursor >= 0 && cards[cursor]) {
      playAllStatus.textContent = (cursor + 1) + " / " + cards.length + " · " + cards[cursor].dataset.title + " · 재생되지 않았습니다";
    }
  };
  const retry = () => {
    const again = player.play();
    if (again && typeof again.then === "function") {
      again.then(() => after(false)).catch(() => after(true));
    } else {
      after(!again);
    }
  };
  if (pending && typeof pending.then === "function") {
    pending.then(() => after(false)).catch(retry);
  } else {
    after(false);
  }
}

function startSong(index, fade, newOrder) {
  clearGapTimer();
  if (index < 0 || index >= cards.length) {
    finishPlaylist();
    return;
  }
  if (Array.isArray(newOrder) && newOrder.length) {
    order = newOrder;
  } else if (!playlist || order.length !== cards.length || order.indexOf(index) < 0) {
    // 새로 시작하면 목록 순서대로, 이 곡부터 마지막 곡까지 이어서 듣습니다.
    order = seqOrder();
    shuffle = false;
  }
  pos = order.indexOf(index);
  playlist = true;
  userPaused = false;
  interrupted = false;
  errorTries = 0;
  lastGoodTime = 0;
  cursor = index;
  phase = "song";
  cancelAnimationFrame(fadeFrame);
  endHandledFor = "";
  if (NATIVE) {
    nat.paused = false;
    nat.time = 0;
    nat.duration = NaN;
    nat.holdUrl = absUrl(cards[index].dataset.audio);
    nat.holdUntil = Date.now() + 5000;
    window.JW3Native.play(pos, nativeList());
  } else {
    // 같은 <audio> 하나에 주소만 바꾸고 바로(기다림 없이) play() 합니다. 화면이 꺼진 상태에서도 이어지게 하려는 것입니다.
    player.volume = 1;
    srcChangedAt = Date.now();
    player.src = cards[index].dataset.audio;
    playAudio();
    if (fade && !pageHidden()) fadeIn();
  }
  setCurrent(cards[index]);
  updateTransport();
  updateSession();
  if (!pageHidden()) revealRow(cards[index]);
}

function scheduleNext() {
  clearGapTimer();
  const next = nextIdx();
  if (!playlist || next < 0) {
    finishPlaylist();
    return;
  }
  if (NATIVE || !GAP_URL || !(GAP_MS > 0)) {
    startSong(next, false);
    return;
  }
  phase = "gap";
  cancelAnimationFrame(fadeFrame);
  player.volume = 1;
  srcChangedAt = Date.now();
  player.src = GAP_URL;
  const pending = player.play();
  if (pending && typeof pending.catch === "function") {
    pending.catch(() => { if (phase === "gap" && !userPaused) startSong(nextIdx(), false); });
  }
  // 무음의 'ended' 를 놓쳤을 때를 대비한 예비 타이머(화면이 켜져 있을 때만 의미가 있습니다).
  gapTimer = setTimeout(() => {
    gapTimer = 0;
    if (phase === "gap" && playlist && !userPaused && (player.ended || player.paused)) startSong(nextIdx(), !pageHidden());
  }, GAP_MS + 2500);
  updateTransport();
  updateSession();
}

// 곡이 끝났을 때 한 번만 다음 곡으로 넘깁니다('ended' 를 놓친 경우 'pause'/'timeupdate' 에서도 잡습니다).
let endHandledFor = "";
function handleEnded() {
  if (NATIVE) return;
  if (phase === "gap") {
    if (endHandledFor === "gap" || userPaused) return;
    endHandledFor = "gap";
    startSong(nextIdx(), !pageHidden());
    return;
  }
  if (phase !== "song") return;
  const src = player.currentSrc || player.src || "";
  if (endHandledFor === src) return;
  endHandledFor = src;
  scheduleNext();
}

// 재생 버튼(화면·알림·잠금 화면): 지금 곡부터 목록 끝까지 연속 재생을 다시 이어 갑니다.
function resumePlayback() {
  if (cursor < 0 || !cards[cursor]) return;
  userPaused = false;
  interrupted = false;
  if (order.length !== cards.length || order.indexOf(cursor) < 0) {
    order = seqOrder();
    shuffle = false;
  }
  pos = order.indexOf(cursor);
  playlist = true;
  if (phase === "idle") phase = "song";
  if (NATIVE) {
    playAudio();
    updateTransport();
    return;
  }
  const want = phase === "gap" ? GAP_URL : absUrl(cards[cursor].dataset.audio);
  if (!player.getAttribute("src") || (player.currentSrc && player.currentSrc !== want)) {
    if (phase === "gap") startSong(nextIdx(), false);
    else startSong(cursor, false);
    return;
  }
  playAudio();
  updateTransport();
}

function pauseByUser() {
  userPaused = true;
  interrupted = false;
  clearGapTimer();
  if (phase === "song" || phase === "gap") pauseAudio();
  updateSession();
  updateTransport();
}

// 다음 곡을 미리 받아 둡니다(곡 끝 30초 전부터, 다음 곡 하나만).
const preloader = NATIVE ? null : new Audio();
if (preloader) {
  preloader.preload = "auto";
  preloader.muted = true;
}
function preloadNext() {
  const n = nextIdx();
  if (!preloader || !playlist || n < 0) return;
  const conn = navigator.connection;
  if (conn && conn.saveData) return;
  const next = absUrl(cards[n].dataset.audio);
  if (preloader.src !== next) {
    preloader.src = next;
    try { preloader.load(); } catch (e) {}
  }
}

player.addEventListener("ended", handleEnded);
player.addEventListener("pause", () => {
  if (NATIVE || userPaused) return;
  if ((phase === "song" || phase === "gap") && player.ended) {
    handleEnded();
    return;
  }
  // 곡 중간에 시스템이 멈춤(전화 등). 보통은 전화가 끝나면 브라우저가 다시 틀어 주고,
  // 아니면 재생 버튼 한 번으로 지금 곡부터 연속 재생이 이어집니다.
  if (phase === "song" && playlist && Date.now() - srcChangedAt > 500) interrupted = true;
  updateTransport();
});
player.addEventListener("playing", () => {
  if (NATIVE) return;
  if (interrupted) {
    interrupted = false;
    updateTransport();
  }
});
// 곡을 못 받으면(네트워크 끊김 등) 같은 자리에서 두 번 다시 시도하고, 그래도 안 되면 다음 곡으로 넘어갑니다.
player.addEventListener("error", () => {
  if (NATIVE || !playlist || userPaused) return;
  if (phase === "gap") {
    startSong(nextIdx(), false);
    return;
  }
  if (phase !== "song" || cursor < 0) return;
  const at = cursor;
  if (errorTries < 2) {
    errorTries += 1;
    const resumeAt = lastGoodTime;
    setTimeout(() => {
      if (cursor !== at || phase !== "song" || userPaused) return;
      player.src = cards[at].dataset.audio;
      if (resumeAt > 1) {
        player.addEventListener("loadedmetadata", () => { try { player.currentTime = resumeAt; } catch (e) {} }, { once: true });
      }
      playAudio();
    }, 1500 * errorTries);
    return;
  }
  scheduleNext();
});
document.addEventListener("visibilitychange", () => {
  if (pageHidden()) {
    // 보이지 않을 때는 화면 효과를 멈추고 소리는 그대로 둡니다.
    cancelAnimationFrame(fadeFrame);
    if (!NATIVE) player.volume = 1;
    clips.forEach((el) => el.pause());
    return;
  }
  if (NATIVE) window.JW3Native.state();
  if (cursor >= 0 && cards[cursor]) {
    syncSlides();
    refreshTimes();
    revealRow(cards[cursor]);
  }
  updateTransport();
});
player.addEventListener("play", updateSession);
player.addEventListener("pause", updateSession);
player.addEventListener("timeupdate", () => {
  if (NATIVE) return;
  if (phase === "gap") {
    if (player.ended) handleEnded();
    return;
  }
  if (phase !== "song") return;
  updatePosition(false);
  const dur = player.duration;
  if (!Number.isFinite(dur) || dur <= 0) return;
  if (player.currentTime > 0) {
    lastGoodTime = player.currentTime;
    if (errorTries && player.currentTime > 5) errorTries = 0;
  }
  const left = dur - (player.currentTime || 0);
  if (left < 30) preloadNext();
  if (player.ended || (left < 0.05 && player.paused && !userPaused)) handleEnded();
});

// 앱(네이티브 플레이어)에서 오는 상태: 지금 곡, 위치, 재생/일시정지, 끝남.
window.JW3NativeEvent = function (s) {
  if (!NATIVE || !s || s.type !== "state") return;
  const url = String(s.url || "");
  if (nat.holdUntil) {
    // 방금 다른 곡을 요청했으면 그 곡 상태가 올 때까지 이전 상태는 무시합니다.
    if (url !== nat.holdUrl && Date.now() < nat.holdUntil) return;
    nat.holdUntil = 0;
  }
  const wasPaused = nat.paused;
  if (s.finished) {
    nat.paused = true;
    if (playlist || cursor >= 0) finishPlaylist();
    return;
  }
  if (!s.active) {
    nat.paused = true;
    if (playlist || cursor >= 0) {
      clearGapTimer();
      phase = "idle";
      playlist = false;
      cursor = -1;
      setCurrent(null);
      updateTransport();
    }
    return;
  }
  let idx = cards.findIndex((card) => absUrl(card.dataset.audio) === url);
  if (idx < 0 && s.index >= 0 && s.index < cards.length) idx = s.index;
  if (idx < 0) return;
  nat.paused = !s.playing;
  nat.gap = !!s.gap;
  nat.count = Number(s.count) || 0;
  nat.time = Number(s.position) || 0;
  nat.duration = Number(s.duration) > 0 ? Number(s.duration) : NaN;
  if (idx !== cursor || !playlist || phase !== "song") {
    clearGapTimer();
    if (order.length !== cards.length || order.indexOf(idx) < 0) {
      order = seqOrder();
      shuffle = false;
    }
    pos = order.indexOf(idx);
    playlist = true;
    phase = "song";
    cursor = idx;
    setCurrent(cards[idx]);
    if (!pageHidden()) revealRow(cards[idx]);
  }
  userPaused = nat.paused;
  if (wasPaused !== nat.paused) player.dispatchEvent(new Event(nat.paused ? "pause" : "play"));
  player.dispatchEvent(new Event("timeupdate"));
  updateTransport();
};

if ("mediaSession" in navigator) {
  const bind = (name, fn) => {
    try { navigator.mediaSession.setActionHandler(name, fn); } catch (e) {}
  };
  bind("play", () => { resumePlayback(); });
  bind("pause", () => { pauseByUser(); });
  bind("stop", () => { stopPlayback(); });
  bind("seekto", (details) => {
    if (NATIVE || phase !== "song" || !details || !Number.isFinite(details.seekTime)) return;
    try {
      if (details.fastSeek && typeof player.fastSeek === "function") player.fastSeek(details.seekTime);
      else player.currentTime = details.seekTime;
    } catch (e) {}
    updatePosition(true);
  });
  bind("previoustrack", () => {
    if (prevIdx() >= 0) startSong(prevIdx(), false);
    else if (cursor >= 0) startSong(cursor, false);
  });
  bind("nexttrack", () => {
    if (nextIdx() >= 0) startSong(nextIdx(), false);
  });
}

if (!songs.length) {
  const empty = document.createElement("p");
  empty.className = "song-empty";
  empty.textContent = "아직 등록된 노래가 없습니다.";
  root.appendChild(empty);
  playAll.disabled = true;
} else {
  let shown = 0;
  songs.forEach((song) => {
    const title = song && song.title ? String(song.title) : "";
    const audio = song && typeof song.audio === "string" ? song.audio.trim() : "";
    const cover = song && typeof song.cover === "string" ? song.cover.trim() : "";
    const duration = song && song.duration ? String(song.duration) : "";
    const credit = (song && song.credit ? String(song.credit) : (typeof DEFAULT_CREDIT === "string" ? DEFAULT_CREDIT : "")).trim();
    if (!title || !audio) return;
    shown += 1;

    const card = document.createElement("article");
    card.className = "song-card";
    card.dataset.audio = audio;
    card.dataset.cover = cover;
    card.dataset.title = title;
    card.dataset.credit = credit;
    if (song && song.plain) card.dataset.plain = "1";

    const button = document.createElement("button");
    button.type = "button";
    button.className = "song-item";

    const thumb = document.createElement("img");
    thumb.className = "song-thumb";
    thumb.alt = "";
    thumb.src = cover;
    const num = document.createElement("span");
    num.className = "song-num";
    num.textContent = String(shown);

    const name = document.createElement("span");
    name.className = "song-title";
    const nameText = document.createElement("span");
    nameText.className = "song-name";
    nameText.textContent = title;
    name.append(nameText);
    if (credit) {
      const creditEl = document.createElement("span");
      creditEl.className = "song-credit";
      creditEl.textContent = credit;
      name.append(creditEl);
    }
    const live = document.createElement("span");
    live.className = "song-live";
    live.textContent = "재생 중";
    live.hidden = true;
    name.append(live);
    button.append(thumb, num, name);
    if (duration) {
      const dur = document.createElement("span");
      dur.className = "song-dur";
      dur.textContent = duration;
      button.append(dur);
    }
    const cue = document.createElement("span");
    cue.className = "song-cue";
    cue.setAttribute("aria-hidden", "true");
    cue.textContent = "▶";
    button.append(cue);

    button.addEventListener("click", () => {
      const index = cards.indexOf(card);
      if (playlist && cursor === index) {
        stopPlayback();
        return;
      }
      startSong(index, false);
    });

    card.append(button);
    cards.push(card);
    root.appendChild(card);
  });
  if (!cards.length) playAll.disabled = true;
}
if (!cards.length) playShuffle.disabled = true;

playAll.addEventListener("click", () => {
  if (playlist) stopPlayback();
  else startSong(0, false, seqOrder());
});
// 랜덤 듣기: 전체 곡을 섞어서 처음부터 끝까지 이어 듣습니다. 랜덤 중에 다시 누르면 멈춥니다.
playShuffle.addEventListener("click", () => {
  if (!cards.length) return;
  if (playlist && shuffle) {
    stopPlayback();
    return;
  }
  const mixed = shuffledOrder();
  shuffle = true;
  startSong(mixed[0], false, mixed);
});
playPrev.addEventListener("click", () => {
  if (prevIdx() >= 0) startSong(prevIdx(), false);
});
playNext.addEventListener("click", () => {
  if (nextIdx() >= 0) startSong(nextIdx(), false);
});
const playPause = document.getElementById("playPause");
const seek = document.getElementById("seek");
const timeNow = document.getElementById("timeNow");
const timeTotal = document.getElementById("timeTotal");
let seeking = false;
function fmt(sec) {
  if (!Number.isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
playPause.addEventListener("click", () => {
  if (cursor < 0) return;
  if (userPaused || media.paused) {
    resumePlayback();
    return;
  }
  pauseByUser();
});
seek.addEventListener("pointerdown", () => { seeking = true; });
seek.addEventListener("pointerup", () => { seeking = false; });
seek.addEventListener("change", () => {
  seeking = false;
  if (phase !== "song" || !Number.isFinite(media.duration)) return;
  const target = (Number(seek.value) / 1000) * media.duration;
  if (NATIVE) {
    nat.time = target;
    window.JW3Native.seek(target);

function refreshTimes() {
